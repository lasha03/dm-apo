name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMs.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMs-apk
          path: DMs.apk

      # A release gives a direct download link that works well from a phone browser.
      - name: Publish "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DMs.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DMs (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download DMs.apk on your phone and open it to install/update."
